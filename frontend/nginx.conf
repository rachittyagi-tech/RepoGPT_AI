# =============================================================================
# frontend/nginx.conf
#
# Production Nginx config for RepoGPT AI's frontend container (Step 14).
# Serves the built React SPA and reverse-proxies /api/ to the backend
# service, so the browser only ever talks to one origin (this container) —
# no CORS round-trip needed between frontend and backend in production.
#
# The upstream host "backend:8000" below is the `backend` service's name
# on the Docker Compose network (see docker-compose.prod.yml) — Docker's
# embedded DNS resolves it, so no templating/envsubst step is needed.
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # ---------------- Gzip ----------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------------- Security headers ----------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # NOTE: adjust connect-src if VITE_API_BASE_URL points at a different
    # origin than this Nginx server itself (e.g. deploying frontend/backend
    # on separate hosts — Option A in the deployment docs).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'" always;

    # ---------------- Static assets — long cache, filenames are content-hashed by Vite ----------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------------- API reverse proxy ----------------
    # Streaming chat (Step 9) responds with text/event-stream — buffering
    # MUST stay off for that route or the browser won't see tokens until
    # the whole response finishes.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming/SSE + WebSocket-upgrade compatibility.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection $http_connection;
        proxy_set_header Upgrade $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Root-level health/docs endpoints also live on the backend.
    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # ---------------- SPA routing ----------------
    # Any path that isn't a real file or /api/* falls back to index.html,
    # so React Router's client-side routes (e.g. /repository, /chat) work
    # on a hard refresh instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Deny access to dotfiles (.env, .git, etc.) if any ever end up in the build output.
    location ~ /\. {
        deny all;
    }
}
